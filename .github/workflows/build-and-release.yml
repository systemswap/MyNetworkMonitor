name: Build & Release MyNetworkMonitor

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: MyNetworkMonitor.Avalonia/MyNetworkMonitor.Avalonia.csproj

jobs:
  # Baut nur, wenn sich <Version> in der csproj gegenueber dem vorherigen
  # Commit geaendert hat - oder wenn der Workflow manuell gestartet wurde.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Version vergleichen
        id: check
        shell: bash
        run: |
          new=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT_PATH")
          echo "New version: $new"
          echo "version=$new" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Start: Build wird erzwungen."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show "HEAD^:$PROJECT_PATH" > /tmp/prev.csproj 2>/dev/null; then
            old=$(grep -oPm1 '(?<=<Version>)[^<]+' /tmp/prev.csproj || echo "")
          else
            old=""
          fi
          echo "Old version: $old"

          if [ "$old" != "$new" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Muss auf einem echten Windows-Runner laufen: die csproj waehlt TargetFramework
  # und die Windows-Provider (MyNetworkMonitor.Platform.Windows) ueber
  # $([MSBuild]::IsOSPlatform('Windows')) - das prueft das Build-Betriebssystem,
  # nicht die Ziel-RID. Cross-Publishing von Linux aus wuerde die Windows-Provider
  # stillschweigend weglassen.
  build-windows:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (self-contained, single Datei)
        shell: pwsh
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/win-x64

      - name: ZIP erstellen
        id: zip
        shell: pwsh
        run: |
          Rename-Item -Path "publish\win-x64\MyNetworkMonitor.Avalonia.exe" -NewName "MyNetworkMonitor.exe"
          $zipName = "MyNetworkMonitor_v${{ needs.check-version.outputs.version }}_windows-x64.zip"
          Compress-Archive -Path publish\win-x64\* -DestinationPath $zipName
          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.zip.outputs.zipname }}

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (self-contained, single Datei)
        run: |
          dotnet publish "$PROJECT_PATH" \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -o publish/linux-x64

      - name: AppDir aufbauen
        run: |
          mv publish/linux-x64/MyNetworkMonitor.Avalonia publish/linux-x64/MyNetworkMonitor

          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r publish/linux-x64/* "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/MyNetworkMonitor"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/MyNetworkMonitor" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/MyNetworkMonitor.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MyNetworkMonitor
          Exec=MyNetworkMonitor
          Icon=MyNetworkMonitor
          Categories=Network;System;
          Terminal=false
          EOF

          cp MyNetworkMonitor.Avalonia/Images/logo.png "$APPDIR/MyNetworkMonitor.png"

      - name: appimagetool laden
        run: |
          curl -L -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: AppImage bauen
        id: appimage
        run: |
          file="MyNetworkMonitor_v${{ needs.check-version.outputs.version }}_x86_64.AppImage"
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ steps.appimage.outputs.file }}

  release:
    needs: [check-version, build-windows, build-linux]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist

      # Der Release-Text soll aus wenigen Stichpunkten bestehen - eine lange
      # Begruendung liest dort niemand. Sie gehoert trotzdem in die Historie,
      # also steht sie in der Commit-Nachricht unterhalb einer Trennlinie aus
      # drei Bindestrichen und wird hier abgeschnitten. Fehlt die Trennlinie,
      # bleibt die Nachricht unveraendert.
      - name: Kurzfassung fuer den Release-Text
        id: notes
        env:
          FULL: ${{ github.event.head_commit.message || format('Manueller Build von Commit {0}', github.sha) }}
        run: |
          short=$(printf '%s\n' "$FULL" | sed '/^---$/,$d')
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$short"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release ${{ needs.check-version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
