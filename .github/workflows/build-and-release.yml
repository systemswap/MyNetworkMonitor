name: Build & Release MyNetworkMonitor

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  # No usage data from the build tools (also set in Directory.Build.targets for Avalonia)
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DO_NOT_TRACK: '1'
  PROJECT_PATH: MyNetworkMonitor.Avalonia/MyNetworkMonitor.Avalonia.csproj

jobs:
  # Baut nur, wenn sich <Version> in der csproj gegenueber dem vorherigen
  # Commit geaendert hat - oder wenn der Workflow manuell gestartet wurde.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Version vergleichen
        id: check
        shell: bash
        run: |
          new=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT_PATH")
          echo "New version: $new"
          echo "version=$new" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Start: Build wird erzwungen."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git show "HEAD^:$PROJECT_PATH" > /tmp/prev.csproj 2>/dev/null; then
            old=$(grep -oPm1 '(?<=<Version>)[^<]+' /tmp/prev.csproj || echo "")
          else
            old=""
          fi
          echo "Old version: $old"

          if [ "$old" != "$new" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs on a Windows runner; the csproj also selects the Windows providers for a win-* runtime built on
  # Linux (publish.sh), so both give the same program.
  build-windows:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (self-contained, single Datei)
        shell: pwsh
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/win-x64

      - name: ZIP erstellen
        id: zip
        shell: pwsh
        run: |
          Rename-Item -Path "publish\win-x64\MyNetworkMonitor.Avalonia.exe" -NewName "MyNetworkMonitor.exe"
          # License, notices on third-party components and their license texts next to the program
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish\win-x64\
          Copy-Item licenses publish\win-x64\licenses -Recurse
          $zipName = "MyNetworkMonitor_v${{ needs.check-version.outputs.version }}_windows-x64.zip"
          Compress-Archive -Path publish\win-x64\* -DestinationPath $zipName
          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.zip.outputs.zipname }}

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (self-contained, single Datei)
        run: |
          dotnet publish "$PROJECT_PATH" \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -o publish/linux-x64

      - name: AppDir aufbauen
        run: |
          # Same layout as publish.sh: program, the data it reads next to itself, license texts,
          # menu entry with the window class MyNetworkMonitor.Avalonia
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r publish/linux-x64/* "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/MyNetworkMonitor.Avalonia"
          cp LICENSE THIRD-PARTY-NOTICES.md "$APPDIR/usr/bin/"
          cp -r licenses "$APPDIR/usr/bin/licenses"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/MyNetworkMonitor.Avalonia" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cp packaging/linux/MyNetworkMonitor.Avalonia.desktop "$APPDIR/MyNetworkMonitor.Avalonia.desktop"
          cp packaging/linux/mynetworkmonitor.png "$APPDIR/mynetworkmonitor.avalonia.png"

      - name: appimagetool laden
        run: |
          # Fixed version with checksum (same tool as publish.sh)
          curl -L -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool.AppImage" | sha256sum -c -
          chmod +x appimagetool.AppImage

      - name: AppImage bauen
        id: appimage
        run: |
          file="MyNetworkMonitor_v${{ needs.check-version.outputs.version }}_x86_64.AppImage"
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run --no-appstream AppDir "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ steps.appimage.outputs.file }}

  release:
    needs: [check-version, build-windows, build-linux]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist

      # Der Release-Text soll aus wenigen Stichpunkten bestehen - eine lange
      # Begruendung liest dort niemand. Sie gehoert trotzdem in die Historie,
      # also steht sie in der Commit-Nachricht unterhalb einer Trennlinie aus
      # drei Bindestrichen und wird hier abgeschnitten. Fehlt die Trennlinie,
      # bleibt die Nachricht unveraendert.
      - name: Kurzfassung fuer den Release-Text
        id: notes
        env:
          FULL: ${{ github.event.head_commit.message || format('Manueller Build von Commit {0}', github.sha) }}
        run: |
          short=$(printf '%s\n' "$FULL" | sed '/^---$/,$d')
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$short"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release ${{ needs.check-version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
